name: ci

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  syntax:
    # 语法检查：三平台 × 三个 Node。都是 node --check，快且不依赖平台行为。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (explicit loop — Windows shell doesn't expand globs)
        shell: bash
        run: |
          for f in lib/*.js bin/*.mjs scripts/*.mjs test/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

  suites:
    # 全量自测：三平台 × 三个 Node。macOS 也跑全量，不再只靠 syntax/verify-install 兜底。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test suites
        run: node test/run-all.mjs

  verify-install:
    # 真装一遍：npm pack → 空目录安装 → 用装机副本启动宿主半 → /ping 读回版本。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: verify:install
        run: npm run verify:install

  registry-tag:
    # 只在推 tag 时跑：核对 registry 上的 latest 是否真的等于 package.json 的版本。
    # 抓的是「publish 打印成功、registry 还是旧版」。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: latest on npm must equal package.json
        run: |
          want=$(node -p "require('./package.json').version")
          got=$(npm view dsh-skill-cockpit@latest version --registry https://registry.npmjs.org)
          echo "package.json=$want registry=$got"
          test "$want" = "$got"
